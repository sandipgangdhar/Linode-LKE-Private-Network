# manifests/post-migration/08-etcd-StatefulSet-3node.yaml
#
# Post-cutover copy of 08-etcd-StatefulSet-3node.yaml: identical workload,
# but scheduling is switched from the dedicated infra-pool
# (nodeSelector/toleration) to a REQUIRED nodeAffinity on vlan-ready=true -
# the label 02-script-vlan-attach.sh already sets on every node
# (mark_node_vlan_ready()) once that node's own VLAN attach, routes, and
# firewall are confirmed done.
#
# Apply this ONLY via ../post-migration-consolidate.sh, and only after
# every app-pool (non-infra-pool) node already carries vlan-ready=true.
# Applying it earlier risks etcd pods sitting Pending mid-rollout, because a
# required nodeAffinity means the scheduler will NEVER fall back to a node
# that hasn't finished VLAN attach yet - see docs/DEPLOYMENT.md for the full
# Day-0 bootstrap-order explanation (this is why the initial deploy still
# uses the infra-pool-pinned version of this file, not this one).
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: kube-system
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: kube-system
spec:
  serviceName: "etcd"
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      # App-pool nodes carry a PERMANENT "vlan-not-ready" taint (see
      # manifests/09-kyverno-vlan-ready-policy.yaml for why it's permanent
      # and never cleared) - a toleration is required or these pods can
      # never schedule here regardless of nodeAffinity. Kyverno's
      # linode-lke-vlan-gating policy would normally grant this
      # automatically, but it deliberately excludes kube-system, so this
      # kube-system workload needs its own explicit copy, same as
      # 05-vlan-ip-initializer-job.yaml/06-vlan-ip-controller-deployment.yaml/
      # 11-vlan-ip-reconciler-cronjob.yaml already do. Tolerate ANY taint
      # (not just vlan-not-ready), not because etcd should run anywhere -
      # the required nodeAffinity below still fully controls that - but
      # because a node needs ALL its taints tolerated to accept a pod at
      # all, and a single-key toleration silently loses the ability to
      # schedule here the moment a sibling project (e.g. lke-e-acl-operator)
      # also places its own permanent taint on this same shared app-pool.
      #
      # The required nodeAffinity below is what keeps etcd off any node
      # that hasn't finished VLAN attach yet - this is the real isolation
      # mechanism now, not the toleration scope. The infra-pool NotIn
      # clause is defense-in-depth: if a node ever ends up carrying both
      # infra-pool=true and vlan-ready=true (e.g. a node repurposed from
      # app-pool to infra-pool without clearing its old label), this still
      # keeps etcd off it - vlan-ready=true alone isn't a strong enough
      # guarantee on its own.
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: vlan-ready
                    operator: In
                    values:
                      - "true"
                  - key: infra-pool
                    operator: NotIn
                    values:
                      - "true"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - etcd
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.12
        command:
          - /usr/local/bin/etcd
        args:
          - --name=$(POD_NAME)
          - --data-dir=/etcd-data
          - --initial-advertise-peer-urls=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2380
          - --listen-peer-urls=http://0.0.0.0:2380
          - --listen-client-urls=http://0.0.0.0:2379
          - --advertise-client-urls=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2379
          - --initial-cluster=etcd-0=http://etcd-0.etcd.kube-system.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd.kube-system.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd.kube-system.svc.cluster.local:2380
          - --initial-cluster-state=new
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        ports:
          - containerPort: 2379
          - containerPort: 2380
        volumeMounts:
          - name: etcd-data
            mountPath: /etcd-data
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Same PDB as the infra-pool version (selector-based, not affected by node
# placement - already applied). Included here too so this file is
# self-sufficient if ever applied standalone.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: kube-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: etcd
