# 05-vlan-ip-initializer-job.yaml
# 
# This YAML file defines a Kubernetes Job to initialize the IP list
# for the VLAN Manager in Linode LKE. It creates the list of available
# IPs in the specified subnet by executing the initialization script
# `05-script-ip-list-initialize.sh`.
# 
# -----------------------------------------------------
# Parameters:
# 
# 1. SUBNET              - The subnet from which IPs are initialized.
# 2. image               - Docker image used to run the initialization script.
# 3. command             - Bash command to execute the script.
# 4. args                - Arguments for the script, including the subnet.
# 5. volumeMounts        - Mounts PersistentVolumeClaims (PVC) and ConfigMaps.
# 6. lifecycle Hooks     - Defines PostStart and PreStop behaviors.
# 
# -----------------------------------------------------
# Usage:
# 
# - This Job is triggered to create an IP list when the VLAN Manager is
#   initialized in Linode LKE.
# - The generated IP list is stored in a Persistent Volume (PVC) and used by
#   the VLAN Manager for allocation.
# 
# -----------------------------------------------------
# Best Practices:
# 
# - Ensure the PersistentVolumeClaim (PVC) is properly mounted.
# - Validate that `/mnt/vlan-ip` is writable before execution.
# - Regularly check the logs for any initialization failures.
# - PostStart and PreStop hooks are used for better lifecycle management.
# 
# -----------------------------------------------------
# Author:
# - Sandip Gangdhar
# - GitHub: https://github.com/sandipgangdhar
# 
# © Linode-LKE-Private-Network | Developed by Sandip Gangdhar | 2025
---
apiVersion: batch/v1
kind: Job
metadata:
  # Name and namespace for the job
  name: vlan-ip-initializer
  namespace: kube-system

spec:
  # Job automatically cleaned up 60 seconds after completion
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0

  template:
    metadata:
      name: vlan-ip-initializer
    spec:
      # Tolerate ANY taint (not just vlan-not-ready) so this Job can still
      # run on the app-pool once a sibling project (e.g. lke-e-acl-operator,
      # whose docs put an acl-not-ready taint on this same shared app-pool)
      # also has its own permanent taint there - a node needs ALL its taints
      # tolerated to accept a pod, so a single-key toleration silently loses
      # the ability to schedule anywhere the moment a second project's taint
      # shows up. This runs in kube-system, excluded from the Kyverno policy
      # that grants this same toleration to application pods, so it needs
      # its own explicit copy here. Pool isolation is enforced via
      # nodeAffinity below, requiring the app-pool LABEL rather than just
      # excluding infra-pool - a cluster can have more than app-pool +
      # infra-pool, and an unlabeled 3rd/4th pool would otherwise silently
      # pick this Job up too. See 07-vlan-manager-daemonset.yaml for the
      # full rationale, this mirrors that fix.
      tolerations:
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app-pool
                    operator: In
                    values:
                      - "true"
      containers:
      - name: vlan-ip-initializer
        image: ghcr.io/sandipgangdhar/linode-lke-private-network:latest
        # Command and Arguments
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "[DEBUG] Exporting environment variables..."
            echo "[DEBUG] ENV SUBNET=$SUBNET REGION=$REGION"
        
            [ ! -d /root/.linode-cli ] && mkdir -p /root/.linode-cli && \
            echo "$LINODE_CLI_CONFIG" > /root/.linode-cli/linode-cli && \
            chmod 600 /root/.linode-cli/* && \
            export LINODE_CLI_CONFIG="/root/.linode-cli/linode-cli"
        
            cp /root/scripts/05-script-ip-list-initialize.sh /mnt/vlan-ip/ && \
            chmod +x /mnt/vlan-ip/05-script-ip-list-initialize.sh && \
            /mnt/vlan-ip/05-script-ip-list-initialize.sh "$SUBNET" "$REGION"

        # Environment variable for subnet
        env:
        - name: SUBNET
          valueFrom:
            configMapKeyRef:
              name: vlan-manager-config
              key: SUBNET
        - name: REGION
          valueFrom:
            configMapKeyRef:
              name: vlan-manager-config
              key: REGION
        - name: LINODE_TOKEN
          valueFrom:
            secretKeyRef:
              name: vlan-manager-secrets
              key: LINODE_API_KEY
        - name: LINODE_CLI_CONFIG
          valueFrom:
            secretKeyRef:
              name: vlan-manager-secrets
              key: LINODE_CLI_CONFIG
        - name: ETCD_ENDPOINTS
          value: "${ETCD_ENDPOINTS}"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: vlan-manager-config
              key: LOG_LEVEL
              optional: true

        # Volume mounts for persistence and script access
        volumeMounts:
        - name: vlan-manager-scripts
          mountPath: /root/scripts

        # Security context to run with elevated permissions
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0          

      # Job should not restart if it fails
      restartPolicy: Never

      # Define Persistent Volumes
      volumes:
      - name: vlan-manager-scripts
        configMap:
          name: vlan-manager-scripts

  # Retry limit for the job
  backoffLimit: 3
