apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: kube-system
  labels:
    app: etcd
spec:
  clusterIP: None
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: kube-system
spec:
  serviceName: "etcd"
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      # Pin etcd to the dedicated infra pool - see 08-etcd-StatefulSet-3node.yaml
      # for the rationale (keeps etcd off nodes that get VLAN-attached/rebooted).
      nodeSelector:
        infra-pool: "true"
      tolerations:
        - key: "infra-pool"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.12
        command:
          - /usr/local/bin/etcd
        args:
          - --name=$(POD_NAME)
          - --data-dir=/etcd-data
          - --listen-client-urls=http://0.0.0.0:2379
          - --advertise-client-urls=http://$(POD_NAME).etcd.kube-system.svc.cluster.local:2379
          # Explicit rather than relying on etcd's own default (currently
          # info as of v3.5, but implicit) - not tied to this repo's
          # LOG_LEVEL ConfigMap key, since etcd is a vendored binary with its
          # own --log-level values, not this project's code.
          - --log-level=info
          - --logger=zap
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

        ports:
          - containerPort: 2379
        volumeMounts:
          - name: etcd-data
            mountPath: /etcd-data
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# PodDisruptionBudget: with a single etcd replica there is no "quorum" to
# protect, but maxUnavailable: 0 still stops voluntary disruptions
# (cluster-autoscaler scale-down, `kubectl drain`) from evicting the only
# copy - a scale-down candidate hosting this pod will simply be skipped.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etcd-pdb
  namespace: kube-system
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: etcd
