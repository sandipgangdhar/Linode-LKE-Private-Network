# 00-vlan-manager-secret.example.template.yaml
#
# Holds the two sensitive values that used to live in the vlan-manager-config
# ConfigMap in plaintext: LINODE_API_KEY and LINODE_CLI_CONFIG. Splitting
# these into a native Kubernetes Secret requires no additional installation
# on LKE Standard or Enterprise - Secrets are a built-in API object on every
# Kubernetes cluster.
#
# -----------------------------------------------------
# Security notes:
#
# - This file (00-vlan-manager-secret.yaml, without the .example.template
#   suffix) is gitignored, same as 00-vlan-manager-configmap.yaml. Never
#   commit the version with your real token filled in.
# - A Kubernetes Secret is base64-encoded at rest, not encrypted - LKE's
#   managed control plane does not currently expose
#   --encryption-provider-config, so this doesn't add cryptographic
#   protection on its own. What it does add: RBAC-gated read access
#   (scoped in 03-vlan-manager-rbac.yaml to just this Secret's name),
#   and it stops the token from being casually visible via `kubectl get
#   configmap -o yaml` or swept up by tooling that dumps ConfigMaps but
#   knows to treat Secrets more carefully.
# - Prefer creating this Secret imperatively instead of ever writing the
#   real token to a YAML file on disk:
#     kubectl create secret generic vlan-manager-secrets -n kube-system \
#       --from-literal=LINODE_API_KEY='<your-token>' \
#       --from-file=LINODE_CLI_CONFIG=<path-to-your-linode-cli-ini-file>
#   The manifest form below is provided for convenience/GitOps workflows,
#   but the imperative command above never leaves your token sitting in
#   a file that could be forgotten or accidentally committed.
# - Scope the underlying Linode API token itself as narrowly as possible
#   (Linode tokens support per-category permission scoping) and rotate it
#   periodically - the Secret only protects where the token lives, not
#   what it's able to do if it ever does leak.
#
# -----------------------------------------------------
# Author:
# - Sandip Gangdhar
# - GitHub: https://github.com/sandipgangdhar
#
# © Linode-LKE-Private-Network | Developed by Sandip Gangdhar | 2025
---
apiVersion: v1
kind: Secret
metadata:
  name: vlan-manager-secrets
  namespace: kube-system
type: Opaque
# Immutable: this Secret's values never need to change at runtime. Setting
# this both prevents accidental edits and stops the kubelet from watching
# it for changes on every pod using it. If you ever need to rotate the
# token, delete and recreate the Secret (immutable Secrets can't be
# patched in place), then roll the pods that consume it.
immutable: true
stringData:
  # Linode API token used by linode-cli and the REST API (vlan-ip-controller).
  LINODE_API_KEY: "REPLACE_WITH_YOUR_LINODE_API_TOKEN"

  # linode-cli configuration file content (same token as above, plus
  # region/user settings) - mounted/exported wherever a container shells
  # out to linode-cli.
  LINODE_CLI_CONFIG: |
      [DEFAULT]
      default-user = REPLACE_WITH_YOUR_LINODE_USER

      [REPLACE_WITH_YOUR_LINODE_USER]
      token = REPLACE_WITH_YOUR_LINODE_API_TOKEN
      region = REPLACE_WITH_YOUR_REGION
      authorized_users = REPLACE_WITH_YOUR_LINODE_USER
      suppress-version-warning = true
