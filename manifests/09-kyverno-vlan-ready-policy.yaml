# 09-kyverno-vlan-ready-policy.yaml
#
# Kyverno ClusterPolicy - "linode-lke-vlan-gating"
#
# This is the second-generation VLAN scheduling gate for this project. The
# full history, for anyone wondering why this isn't a plain node taint:
#
#   1. Originally: a Kyverno policy mutated a required nodeAffinity
#      (nodeSelectorTerms) onto every application pod. This broke when a
#      second, unrelated project's Kyverno policy also patched
#      nodeSelectorTerms via patchStrategicMerge - that field has no merge
#      key, so strategic-merge does a full list replace, and whichever
#      policy Kyverno evaluated last silently clobbered the other's patch.
#   2. We replaced it with a plain node taint ("vlan-not-ready"), declared
#      at LKE node-pool config time and cleared per-node by vlan-manager
#      once VLAN attach completed. This avoided the Kyverno collision, but
#      hit a different, worse problem: LKE treats pool-level taints as
#      permanent desired state and continuously reconciles them back onto
#      every node in the pool - including nodes that already finished VLAN
#      attach and had their taint legitimately cleared. We were fighting
#      the platform's own control loop and losing.
#   3. This policy is the fix for both problems at once. The taint is now
#      declared PERMANENTLY at the pool level and we never try to remove
#      it - so there's nothing left to fight. The dynamic "is this specific
#      node actually ready" signal moves entirely to the vlan-ready=true
#      node LABEL (owned exclusively by scripts/02-script-vlan-attach.sh,
#      never touched by LKE), and THIS is what Kyverno injects as a
#      required nodeSelector - a flat map, not a list. A second project's
#      policy adding its own different key (e.g. acl-ready: "true") to the
#      same nodeSelector map can never collide with this one, in any
#      install order, because map keys merge independently. Tolerations
#      are still a list, so that half of the injection uses an explicit
#      JSON Patch *append* (patchesJson6902, op: add, path ending in /-)
#      instead of patchStrategicMerge - an append can never overwrite
#      whatever a differently-named policy already added to the same list.
#
# Companion projects (e.g. lke-e-acl-operator) that need their own,
# independent gate should follow this exact template: autogenControllers:
# none, match Pod only, same exclude list, one unique nodeSelector key, one
# unique toleration key, same three-rule (require / add-if-absent /
# append-if-present) shape. No existing policy - including this one - ever
# needs to change when a new project's gate is added.
#
# -----------------------------------------------------
# Author:
# - Sandip Gangdhar
# - GitHub: https://github.com/sandipgangdhar
#
# © Linode-LKE-Private-Network | Developed by Sandip Gangdhar | 2025
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: linode-lke-vlan-gating
  annotations:
    policies.kyverno.io/title: Linode LKE VLAN Gating
    policies.kyverno.io/category: Scheduling
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >
      Requires application pods to land only on nodes labeled
      vlan-ready=true, and grants the toleration needed to schedule past
      the permanent vlan-not-ready node taint. Excludes kube-system,
      kyverno, kube-public, and kube-node-lease - those workloads (the
      VLAN IP initializer Job, vlan-ip-controller Deployment, and
      vlan-ip-reconciler CronJob) carry their own explicit, permanent
      tolerations in their manifests instead, since Kyverno intentionally
      never touches kube-system.
    # This is the fix for the autogen-controllers bug: the first-generation
    # policy's autogenerated rules also patched owning controllers, silently
    # mutating unrelated projects' workloads that merely happened to run in
    # a non-excluded namespace. NOTE: despite living under a "spec"-looking
    # concept, Kyverno only accepts this as a metadata annotation, not a
    # spec field - spec.autogenControllers doesn't exist in the CRD and
    # is rejected by strict decoding.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-vlan-ready-node
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kube-public
                - kube-node-lease
      mutate:
        # nodeSelector is a flat key:value map, not a list - safe to
        # strategic-merge. Map keys merge independently, so a second
        # project's policy adding a different key here (or a pod that
        # already sets some unrelated nodeSelector key of its own) is
        # never at risk of being overwritten or overwriting us.
        patchStrategicMerge:
          spec:
            nodeSelector:
              vlan-ready: "true"

    - name: add-vlan-toleration-new-list
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kube-public
                - kube-node-lease
      # Only fires when the pod defines no tolerations at all yet.
      preconditions:
        all:
          - key: "{{ request.object.spec.tolerations || '' }}"
            operator: Equals
            value: ""
      mutate:
        patchStrategicMerge:
          spec:
            tolerations:
              - key: vlan-not-ready
                operator: Equal
                value: "true"
                effect: NoSchedule

    - name: append-vlan-toleration-existing-list
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kube-public
                - kube-node-lease
      # Only fires when the pod already defines at least one toleration -
      # the complement of the rule above, so exactly one of the two ever
      # applies to a given pod.
      preconditions:
        all:
          - key: "{{ request.object.spec.tolerations || '' }}"
            operator: NotEquals
            value: ""
      mutate:
        # JSON Patch append (op: add, path ending in /-) only ever adds a
        # new element at the end of the list. Unlike patchStrategicMerge on
        # a merge-key-less list, this can never overwrite what another
        # policy (or the pod author) already put in this same array,
        # regardless of which policy Kyverno evaluates first.
        patchesJson6902: |-
          - op: add
            path: /spec/tolerations/-
            value:
              key: vlan-not-ready
              operator: Equal
              value: "true"
              effect: NoSchedule
