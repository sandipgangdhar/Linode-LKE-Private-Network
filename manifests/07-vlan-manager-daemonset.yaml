# 07-vlan-manager-daemonset.yaml
# 
# This YAML file defines the DaemonSet for the VLAN Manager in Linode LKE.
# It provisions a VLAN attachment on each worker node and manages the IP
# routing through configured scripts. This DaemonSet ensures that each node
# is correctly attached to the VLAN and ready for internal communication.
# 
# -----------------------------------------------------
# Parameters:
# 
# 1. hostNetwork          - Allows direct network access for VLAN configuration.
# 2. dnsPolicy            - Configures DNS policy for host networking.
# 3. serviceAccountName   - Uses RBAC to manage VLAN and Linode configurations.
# 4. image                - Docker image for executing the VLAN scripts.
# 5. command & args       - Shell commands to install dependencies and run scripts.
# 6. volumeMounts         - Mount paths for scripts and configuration files.
# 7. env                  - Environment variables fetched from ConfigMaps.
# 
# -----------------------------------------------------
# Usage:
# 
# - This DaemonSet is deployed on every worker node in the cluster.
# - It configures VLAN attachment and IP routing through Linode CLI.
# - Dependencies are installed during initialization to ensure smooth execution.
# 
# -----------------------------------------------------
# Best Practices:
# 
# - Ensure that the "vlan-manager-scripts" ConfigMap is correctly configured.
# - Use security context for privileged operations.
# - Monitor logs for dependency installation and VLAN attachment.
# - Validate kubeconfig before executing Kubernetes commands.
# 
# -----------------------------------------------------
# Author:
# - Sandip Gangdhar
# - GitHub: https://github.com/sandipgangdhar
# 
# © Linode-LKE-Private-Network | Developed by Sandip Gangdhar | 2025
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  # Name and namespace for the DaemonSet
  name: vlan-manager
  namespace: kube-system

spec:
  # Selector for pod matching
  selector:
    matchLabels:
      app: vlan-manager

  template:
    metadata:
      labels:
        app: vlan-manager

    spec:
      # Enable host network for direct VLAN configuration
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      # Use the service account with required RBAC permissions
      serviceAccountName: vlan-manager-sa

      # Tolerate ANY taint so vlan-manager can land on the app-pool
      # regardless of which sibling projects (e.g. lke-e-acl-operator, whose
      # own docs put an `acl-not-ready` taint on this exact same shared
      # app-pool - see lke-e-acl-operator/docs/deployment-guide.md) also
      # place their own permanent taint there. A node with taints from two
      # independent projects needs a pod to tolerate BOTH to schedule at
      # all - this used to be scoped to just "vlan-not-ready", which meant
      # vlan-manager could no longer run on the app-pool at all the moment
      # a second project's taint also landed there, in either deploy order,
      # and would have needed a manual edit here for every future sibling
      # project too. Wildcard tolerance matches the same "zero coordination
      # required for a new sibling project" goal already used for the
      # Kyverno gating layer (see 09-kyverno-vlan-ready-mutatingpolicy.yaml,
      # or 09-kyverno-vlan-ready-policy.yaml on the legacy fallback path).
      #
      # Pool isolation (keeping this DaemonSet OFF infra-pool nodes, which
      # must stay reserved for etcd/vlan-config-controller/CoreDNS/Kyverno)
      # used to rely on simply never tolerating infra-pool's own taint -
      # that no longer works once tolerations are a wildcard, so it's now
      # enforced explicitly below via nodeAffinity.
      #
      # Requires the app-pool LABEL (not just "absence of infra-pool"): a
      # cluster can have more than just app-pool + infra-pool - any 3rd/4th
      # pool with no label and no taint would otherwise silently pick up
      # vlan-manager too, since a plain "exclude infra-pool" rule treats
      # "not infra-pool" as "is app-pool", which stops being true the
      # moment a 3rd pool exists. Opt-in via the app-pool=true label (set
      # alongside app-pool's taint at pool-create/pool-update time - see
      # docs/DEPLOYMENT.md Installation step 1) instead: only pools you've
      # deliberately labeled get VLAN attached, and any future pool is
      # excluded by default until you label it.
      tolerations:
        - operator: Exists

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app-pool
                    operator: In
                    values:
                      - "true"

      containers:
        - name: vlan-manager
          image: ghcr.io/sandipgangdhar/linode-lke-private-network:latest

          # Security context to allow privileged VLAN operations
          securityContext:
            privileged: true

          # Command and Arguments
          command: ["/bin/bash", "-c"]
          args: 
            - |
              #sleep 60
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') Starting VLAN Manager setup (bootstrap)..."

              # === Configure Linode CLI ===
              mkdir -p /root/.linode-cli && \
              echo "$LINODE_CLI_CONFIG" > /root/.linode-cli/linode-cli && \
              chmod 600 /root/.linode-cli/* && \
              export LINODE_CLI_CONFIG="/root/.linode-cli/linode-cli" && \
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') Linode CLI configuration completed."

              # === Copy Scripts ===
              cp --dereference /root/scripts/02-script-vlan-attach.sh /tmp/02-script-vlan-attach.sh && \
              chmod u+x /tmp/02-script-vlan-attach.sh && \
              ls_output_02_script_vlan_attach=`ls -l /tmp/02-script-vlan-attach.sh` && \
              echo "[VLAN-MANAGER] [DEBUG] $(date '+%Y-%m-%d %H:%M:%S') ls output: $ls_output_02_script_vlan_attach"
              cp --dereference /root/scripts/03-script-ip-allocate.sh /tmp/03-script-ip-allocate.sh && \
              chmod u+x /tmp/03-script-ip-allocate.sh && \
              ls_output_03_script_ip_allocate=`ls -l /tmp/03-script-ip-allocate.sh` && \
              echo "[VLAN-MANAGER] [DEBUG] $(date '+%Y-%m-%d %H:%M:%S') ls output: $ls_output_03_script_ip_allocate"
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') Scripts copied and permissions set."

              # === Generate kubeconfig ===
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') Generating kubeconfig..."
              cat <<EOF > /tmp/kubeconfig
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT_HTTPS
                name: in-cluster
              contexts:
              - context:
                  cluster: in-cluster
                  user: in-cluster
                name: in-cluster
              current-context: in-cluster
              users:
              - name: in-cluster
                user:
                  token: $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              EOF

              export KUBECONFIG=/tmp/kubeconfig
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') kubeconfig generated successfully."

              # === Execute VLAN Attachment Script ===
              echo "[VLAN-MANAGER] [INFO] $(date '+%Y-%m-%d %H:%M:%S') Starting VLAN Attachment Script..."
              /tmp/02-script-vlan-attach.sh
              #sleep infinity

          # Environment variables
          env:
            # Downward API, not the ConfigMap - this pod's own node name is
            # known to Kubernetes directly and needs no discovery logic at
            # all. Preferred over deriving it from `ip route get 8.8.8.8`'s
            # src address (the old method): that address stops being a
            # reliable stand-in for "this node's identity" the moment
            # ENABLE_NAT_GATEWAY changes what the default route's src is -
            # confirmed live, see docs/NAT-Test.md.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: LKE_CLUSTER_TYPE
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: LKE_CLUSTER_TYPE
            - name: ENABLE_VLAN
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_VLAN

            - name: ROUTE_LIST
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ROUTE_LIST

            - name: SUBNET
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: SUBNET

            - name: VLAN_LABEL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: VLAN_LABEL

            - name: KUBECONFIG
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: KUBECONFIG

            - name: LINODE_CLI_CONFIG
              valueFrom:
                secretKeyRef:
                  name: vlan-manager-secrets
                  key: LINODE_CLI_CONFIG

            - name: LINODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vlan-manager-secrets
                  key: LINODE_API_KEY

            - name: ENABLE_PUSH_ROUTE
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_PUSH_ROUTE

            - name: ENABLE_FIREWALL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_FIREWALL

            - name: LKE_CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: LKE_CLUSTER_ID

            # === NEW: VPC interface config ===
            - name: ENABLE_VPC_INTERFACE
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_VPC_INTERFACE

            - name: VPC_SUBNET_ID
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: VPC_SUBNET_ID

            # === NEW: VLAN east–west firewall ===
            - name: ENABLE_VLAN_EW_FIREWALL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_VLAN_EW_FIREWALL

            # === NAT Gateway (route all internet-bound traffic via one
            # instance on the VLAN) - see push_nat_gateway_route() in
            # 02-script-vlan-attach.sh and the ConfigMap's own comment block
            # for the full design. Both optional; ENABLE_NAT_GATEWAY only
            # here defaults false internally if the key is ever absent. ===
            - name: ENABLE_NAT_GATEWAY
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_NAT_GATEWAY
                  optional: true

            - name: NAT_GATEWAY_IP
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: NAT_GATEWAY_IP
                  optional: true

            # === NAT Fleet (HA/ECMP egress via a linode-nat-gateway fleet,
            # driven by the nat-fleet-agent sidecar container below) ===
            - name: ENABLE_NAT_FLEET
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_NAT_FLEET
                  optional: true

            # Where mark_node_vlan_ready() writes the confirmed VLAN
            # interface name + readiness marker for the sidecar to consume -
            # see the shared nat-fleet-handoff volume below. Only the main
            # container writes here; harmless if ENABLE_NAT_FLEET is unset.
            - name: NAT_FLEET_HANDOFF_DIR
              value: "/var/run/nat-fleet"

            # ETCD endpoints (you can keep this as-is or hardcode)
            - name: ETCD_ENDPOINTS
              value: "${ETCD_ENDPOINTS}"

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: LOG_LEVEL
                  optional: true
          # Volume mounts for scripts
          volumeMounts:
            - name: vlan-manager-scripts
              mountPath: /root/scripts
            - name: nat-fleet-handoff
              mountPath: /var/run/nat-fleet

        # === nat-fleet-agent sidecar: HA/ECMP egress via a
        # linode-nat-gateway fleet, mutually exclusive with the
        # single-node ENABLE_NAT_GATEWAY feature above (see the mutual-
        # exclusivity check near the top of 02-script-vlan-attach.sh).
        # Always deployed, like every other optional feature in this repo
        # (ENABLE_FIREWALL, ENABLE_VLAN_EW_FIREWALL) - idles immediately
        # via scripts/12-nat-fleet-agent-entrypoint.sh if ENABLE_NAT_FLEET
        # isn't "true". Separate container rather than a background
        # process inside the main container's script - see that
        # entrypoint script's header comment for why (kubelet-native
        # crash-restart/SIGTERM handling vs. this repo's own history of
        # hand-rolled-supervision bugs).
        - name: nat-fleet-agent
          image: ghcr.io/sandipgangdhar/linode-lke-private-network:latest

          # CAP_NET_ADMIN only (confirmed from the real client-agent
          # systemd unit: AmbientCapabilities=CAP_NET_ADMIN) - tighter than
          # the main container's privileged: true, since this container
          # only ever needs to manage routes on the shared host network.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]

          command: ["/bin/bash", "-c"]
          args:
            - |
              cp --dereference /root/scripts/12-nat-fleet-agent-entrypoint.sh /tmp/12-nat-fleet-agent-entrypoint.sh && \
              chmod u+x /tmp/12-nat-fleet-agent-entrypoint.sh && \
              exec /tmp/12-nat-fleet-agent-entrypoint.sh

          env:
            - name: ENABLE_NAT_FLEET
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: ENABLE_NAT_FLEET
                  optional: true

            - name: NAT_FLEET_ROSTER_URL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: NAT_FLEET_ROSTER_URL
                  optional: true

            - name: NAT_FLEET_FALLBACK_PROBE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: NAT_FLEET_FALLBACK_PROBE_ENABLED
                  optional: true

            - name: NAT_FLEET_FALLBACK_PROBE_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: NAT_FLEET_FALLBACK_PROBE_INTERVAL
                  optional: true

            - name: NAT_FLEET_HEALTH_PROBE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: NAT_FLEET_HEALTH_PROBE_TIMEOUT
                  optional: true

            - name: NAT_FLEET_HANDOFF_DIR
              value: "/var/run/nat-fleet"

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: vlan-manager-config
                  key: LOG_LEVEL
                  optional: true

          volumeMounts:
            - name: vlan-manager-scripts
              mountPath: /root/scripts
            - name: nat-fleet-handoff
              mountPath: /var/run/nat-fleet

      # Volumes to be mounted
      volumes:
        - name: vlan-manager-scripts
          configMap:
            name: vlan-manager-scripts

        # Shared between vlan-manager and nat-fleet-agent: the confirmed
        # VLAN interface name + a readiness marker (see
        # mark_node_vlan_ready() in scripts/02-script-vlan-attach.sh and
        # scripts/12-nat-fleet-agent-entrypoint.sh).
        - name: nat-fleet-handoff
          emptyDir: {}
